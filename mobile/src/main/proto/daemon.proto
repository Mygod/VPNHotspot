syntax = "proto3";

package vpnhotspot.daemon;

option java_package = "be.mygod.vpnhotspot.root.daemon";
option java_outer_classname = "DaemonProto";
option optimize_for = LITE_RUNTIME;

// Deliberately carries no protocol version. The daemon is not a separately installed component: it is
// exec'd in place from the same APK as the dex that launched it, so the two cannot disagree. An app
// upgrade kills the app's processes and removes the old APK path, a leftover daemon from a previous
// version connects to a socket name that no longer exists, and a tampered APK controls both sides
// anyway. Add one only if the daemon ever ships or updates independently of the dex.

// Shizuku-mode session control, which is the same conversation shape as root - ClientEnvelope in,
// DaemonEnvelope out, every failure attributable to the call that caused it - and none of root's
// vocabulary. Downstream, masquerade, ipv6_nat and the per-MAC client list all describe mutations that need
// root, so a shared config message would mean one type whose meaning depends on which UID reads it.
//
// A process answers one of the two command families and refuses the other outright: the root daemon rejects
// an app-UID command and the app-UID daemon rejects a root command, both as an error on the offending call.
//
// The config is level-triggered and the newest one is the whole truth: bind to this network, and serve or do
// not. That is what lets the app coalesce - one pending slot holding the latest update - without the daemon
// having to replay a history it was never sent.
//
// Nothing here names a tethered client, and nothing here reports one. Android's own conntrack owns the
// mapping between a tethered client and the TUN-visible endpoint the daemon keys its state by, so that
// endpoint changing hands is not observable on either side. Two consequences, and they are different:
// downstream membership is not observed at all - the app watches tethering's upstream and never its interface
// lists, so a downstream joining or leaving the same upstream moves no field here - while losing or regaining
// ACTIVE moves admit and never a retirement stamp. upstream_generation is the only retirement stamp the
// config carries.
message ShizukuSessionConfig {
  // Nonzero and strictly increasing, so an acknowledgement can be matched to the config that produced it
  // and a zero-initialised view of it can never look current. A superseded config is never sent at all: the
  // controller coalesces to one pending slot, so its caller returns normally once the newest config in that
  // slot has been acknowledged, rather than carrying a sequence of its own.
  uint64 sequence = 1;
  // Which Network upstream sockets are bound to. Incremented by the app on upstream property changes,
  // and never the Network handle itself: a handle is derived from a netId, so it survives a
  // LinkProperties change that invalidates pinned state and is eventually reused by an unrelated network.
  uint64 upstream_generation = 2;
  // Only the app knows the session is ACTIVE, and only the daemon owns the TUN, so admission travels in
  // the config rather than being inferred. Level-triggered like everything else here, and it retires nothing
  // in either direction: closing it makes the daemon drop what it reads from the TUN and create or refresh
  // nothing, and reopening it takes up again with whatever is still there. Closed is not paused, though -
  // deadlines keep running and protocols keep finishing throughout - so what a reopened session resumes with
  // is what independently survived the interval rather than a guarantee about any particular connection.
  bool admit = 4;
  // Absent means no selectable Network right now, which is not a failure: upstream work fails per
  // operation and the session resumes on the next config. There is no fallback network in this mode.
  optional uint64 upstream_network = 5;
  // The exact set every destination is compared against before attribution, reassembly, or transport
  // dispatch, as packed 4- or 16-byte addresses. Traffic to one of these is platform_dns only on an exact
  // TCP/UDP port-53 endpoint; anything else to a reserved address is dropped without a response.
  repeated bytes virtual_addresses = 6;
  // The interface's own addresses, one per family, as packed 4- or 16-byte values. An ICMP error the daemon
  // originates comes from one of these, because that is the address a router in its position would speak from;
  // without the matching family the error is not sent at all rather than sent from something else.
  repeated bytes gateway_addresses = 9;
  // Interface index of upstream_network, which every relayed reply must have arrived on. Absent together
  // with upstream_network, and absent on its own when the app cannot resolve the name to an index.
  //
  // Not diagnostic. Inbound UDP and ICMP demultiplex on local address and port alone, and the mark that
  // steers egress takes no part in it, so a late reply to a retired mapping can be delivered to whatever
  // socket now holds that identity; requiring the arrival interface to match this is what rejects it.
  optional uint32 upstream_interface_index = 8;
}

// Sent once per applied config, and only once whatever that config retires is really gone rather than merely
// asked to go. Carries the generation as well as the sequence because that is what says the state bound to
// the selection the session has left is actually back.
message ShizukuApplied {
  uint64 sequence = 1;
  uint64 upstream_generation = 2;
  bool admitting = 4;
}

message ClientEnvelope {
  uint64 call_id = 1;
  oneof command {
    CancelCommand cancel = 2;
    StartSessionCommand start_session = 3;
    ReplaceSessionCommand replace_session = 4;
    ReadTrafficCountersCommand read_traffic_counters = 5;
    StartNeighbourMonitorCommand start_neighbour_monitor = 6;
    CleanRoutingCommand clean_routing = 7;
    ReplaceStaticAddressesCommand replace_static_addresses = 8;
    StartShizukuSessionCommand start_shizuku_session = 9;
    ApplyShizukuConfigCommand apply_shizuku_config = 10;
  }
}

message CancelCommand {}

// The app-UID session's start call, and an event-style call like StartSessionCommand: its call ID owns the
// dataplane for as long as the session runs, and its ACK is the readiness the app waits for.
//
// Sent with exactly one SCM_RIGHTS descriptor, which must be the TUN the daemon will own. The sender cannot
// prove what arrived, so every field here is something the receiver re-checks against the descriptor itself.
// The descriptor rides on this one frame, so the app writes it with a single write and the daemon reads the
// whole frame with recvmsg.
message StartShizukuSessionCommand {
  string interface_name = 1;
  // The session's whole packet-sizing contract, checked against the descriptor's own interface MTU before the
  // dataplane is built. Sent once and never again: this is the TestNetwork's fixed MTU - the value its TUN was
  // created with, the value its agent published, and the value tethering clamps the downstream MTU it derives
  // from this upstream to - so no config can move it and none carries it.
  uint32 mtu = 2;
}

// One level-triggered config, keyed to the start call that owns the session. A one-shot call: its reply is
// the ShizukuApplied acknowledgement, and its error is the refusal that ends the session.
message ApplyShizukuConfigCommand {
  uint64 session_id = 1;
  ShizukuSessionConfig config = 2;
}

message StartSessionCommand {
  SessionConfig config = 1;
}

message ReplaceSessionCommand {
  uint64 session_id = 1;
  SessionConfig config = 2;
}

message ReadTrafficCountersCommand {}

message StartNeighbourMonitorCommand {}

message CleanRoutingCommand {
  string ipv6_nat_prefix_seed = 1;
}

message ReplaceStaticAddressesCommand {
  string dev = 1;
  repeated IpAddressEntry addresses = 2;
}

message SessionConfig {
  string downstream = 1;
  bool ip_forward = 2;
  MasqueradeMode masquerade = 3;
  bool ipv6_block = 4;
  optional uint64 primary_network = 5;
  repeated Ipv6Prefix primary_routes = 6;
  optional uint64 fallback_network = 7;
  repeated string primary_upstream_interfaces = 8;
  repeated string fallback_upstream_interfaces = 9;
  repeated ClientConfig clients = 10;
  optional Ipv6NatConfig ipv6_nat = 11;
  uint64 upstream_generation = 12;
}

enum MasqueradeMode {
  MASQUERADE_MODE_NONE = 0;
  MASQUERADE_MODE_SIMPLE = 1;
  MASQUERADE_MODE_NETD = 2;
}

message ClientConfig {
  bytes mac = 1;
  repeated bytes ipv4 = 2;
}

message Ipv6NatConfig {
  string prefix_seed = 1;
}

message Ipv6Prefix {
  bytes address = 1;
  uint32 prefix_length = 2;
}

message IpAddressEntry {
  bytes address = 1;
  uint32 prefix_length = 2;
}

message DaemonEnvelope {
  oneof frame {
    ReplyFrame reply = 1;
    EventFrame event = 2;
    ErrorFrame error = 3;
    NonFatalFrame non_fatal = 4;
    CompleteFrame complete = 5;
  }
}

message ReplyFrame {
  uint64 call_id = 1;
  oneof payload {
    Ack ack = 2;
    TrafficCounters traffic_counters = 3;
    ShizukuApplied shizuku_applied = 4;
  }
}

message EventFrame {
  uint64 call_id = 1;
  oneof payload {
    Ack ack = 2;
    NeighbourMonitorUpdate neighbour_monitor = 3;
    IpSecForwardPolicyRequest ipsec_forward_policy = 4;
  }
}

message ErrorFrame {
  uint64 call_id = 1;
  DaemonErrorReport report = 2;
}

message NonFatalFrame {
  optional uint64 call_id = 1;
  DaemonErrorReport report = 2;
}

message CompleteFrame {
  uint64 call_id = 1;
}

message Ack {}

message TrafficCounters {
  repeated TrafficCounter counters = 1;
}

message TrafficCounter {
  bytes mac = 1;
  string downstream = 2;
  TrafficCounterSource source = 3;
  uint64 sent_packets = 4;
  uint64 sent_bytes = 5;
  uint64 received_packets = 6;
  uint64 received_bytes = 7;
}

message TrafficCounterSource {
  oneof source {
    bytes ipv4_forward_address = 1;
    DaemonTrafficSource daemon_source = 2;
  }
}

enum DaemonTrafficSource {
  DAEMON_TRAFFIC_SOURCE_UNSPECIFIED = 0;
  DAEMON_TRAFFIC_SOURCE_DNS = 1;
  DAEMON_TRAFFIC_SOURCE_NAT66_TCP = 2;
  DAEMON_TRAFFIC_SOURCE_NAT66_UDP = 3;
  DAEMON_TRAFFIC_SOURCE_NAT66_ICMPV6 = 4;
}

message NeighbourMonitorUpdate {
  repeated NeighbourDelta neighbour_deltas = 1;
  LinkTopologySnapshot link_topology = 2;
}

message IpSecForwardPolicyRequest {
  int32 uid = 1;
  string source_address = 2;
  string destination_address = 3;
  int32 mark_value = 4;
  int32 xfrm_interface_id = 5;
}

message LinkTopologySnapshot {
  repeated BridgeInterface bridges = 1;
}

message BridgeInterface {
  string name = 1;
  repeated string members = 2;
}

message NeighbourDelta {
  oneof delta {
    Neighbour upsert = 1;
    NeighbourDelete delete = 2;
  }
}

message Neighbour {
  bytes address = 1;
  string dev = 2;
  optional bytes lladdr = 3;
  NeighbourState state = 4;
}

message NeighbourDelete {
  bytes address = 1;
  string dev = 2;
}

enum NeighbourState {
  NEIGHBOUR_STATE_UNSET = 0;
  NEIGHBOUR_STATE_INCOMPLETE = 1;
  NEIGHBOUR_STATE_VALID = 2;
  NEIGHBOUR_STATE_FAILED = 3;
}

message DaemonErrorReport {
  string context = 1;
  string message = 2;
  optional int32 errno = 3;
  string kind = 4;
  string file = 5;
  uint32 line = 6;
  uint32 column = 7;
  uint32 pid = 8;
  repeated ErrorDetail details = 9;
}

message ErrorDetail {
  string key = 1;
  string value = 2;
}
